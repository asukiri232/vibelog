{% if user.is_authenticated %}
<div id="vl-report" class="vl-report" hidden role="dialog" aria-modal="true" aria-labelledby="vl-report-title">
  <button type="button" class="vl-report__backdrop" id="vl-report-backdrop" tabindex="-1" aria-label="Закрыть"></button>
  <div class="vl-report__panel">
    <h2 id="vl-report-title" class="vl-report__title">Пожаловаться</h2>
    <p class="vl-report__lead">Выберите причину или опишите проблему своими словами.</p>
    <form method="post" action="{% url 'vibel:report_content' %}" id="vl-report-form" class="vl-report__form">
      {% csrf_token %}
      <input type="hidden" name="target_type" id="vl-report-target-type" value="">
      <input type="hidden" name="target_id" id="vl-report-target-id" value="">
      <input type="hidden" name="next" id="vl-report-next" value="{{ request.get_full_path }}">

      <fieldset class="vl-report__reasons">
        <legend class="vl-report__legend">Причина</legend>
        {% for value, label in report_reason_choices %}
          <label class="vl-report__reason">
            <input type="radio" name="reason_choice" value="{{ value }}" class="vl-report__radio">
            <span class="vl-report__reason-text">{{ label }}</span>
          </label>
        {% endfor %}
      </fieldset>

      <div class="vl-report__other" id="vl-report-other-wrap" hidden>
        <label class="vl-label" for="vl-report-reason-other">Своя причина</label>
        <textarea name="reason_other" id="vl-report-reason-other" class="vl-input vl-textarea" rows="3" maxlength="500" placeholder="Кратко опишите, что не так…"></textarea>
      </div>

      <div class="vl-report__actions">
        <button type="button" class="vl-btn vl-btn--outline" id="vl-report-cancel">Отмена</button>
        <button type="submit" class="vl-btn">Отправить жалобу</button>
      </div>
    </form>
  </div>
</div>
{% endif %}
