{% with rn=request.resolver_match.url_name %}
<nav class="vl-quick-actions vl-quick-actions--rail" aria-label="Основная навигация">
  <div class="vl-quick-actions__group">
    <a href="{% url 'vibel:feed' %}" class="vl-rail-link{% if rn == 'feed' %} vl-rail-link--current{% endif %}">
      <span class="vl-rail-link__ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </span>
      <span class="vl-rail-link__label">Лента</span>
    </a>
    <a href="{% url 'vibel:saved_posts' %}" class="vl-rail-link{% if rn == 'saved_posts' %} vl-rail-link--current{% endif %}">
      <span class="vl-rail-link__ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-6-4-6 4V2z"/></svg>
      </span>
      <span class="vl-rail-link__label">Избранное</span>
    </a>
    <a href="{% url 'vibel:post_create' %}" class="vl-rail-link{% if rn == 'post_create' %} vl-rail-link--current{% endif %}">
      <span class="vl-rail-link__ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
      </span>
      <span class="vl-rail-link__label">Новый пост</span>
    </a>
  </div>
  <div class="vl-quick-actions__group vl-quick-actions__group--secondary">
    <a href="{% url 'vibel:messages_inbox' %}" class="vl-rail-link{% if rn == 'messages_inbox' or rn == 'messages_thread' %} vl-rail-link--current{% endif %}">
      <span class="vl-rail-link__ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 3V6a2 2 0 0 1 2-2z"/></svg>
        {% if unread_dm_count %}
          <span class="vl-rail-link__badge">{{ unread_dm_count }}</span>
        {% endif %}
      </span>
      <span class="vl-rail-link__label">Сообщения</span>
    </a>
    <a href="{% url 'vibel:notifications' %}" class="vl-rail-link{% if rn == 'notifications' %} vl-rail-link--current{% endif %}">
      <span class="vl-rail-link__ico" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        {% if unread_notifications_count %}
          <span class="vl-rail-link__badge">{{ unread_notifications_count }}</span>
        {% endif %}
      </span>
      <span class="vl-rail-link__label">Уведомления</span>
    </a>
  </div>
</nav>
{% endwith %}
